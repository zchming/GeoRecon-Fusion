name: CPU unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install -e '.[teaching,optimization,colmap]'
          python -m pip check
      - name: Run unit tests and report actual outcomes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import unittest
          import cv2, numpy, PIL, pycolmap, scipy

          class CountedResult(unittest.TextTestResult):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.passed = 0

              def addSuccess(self, test):
                  super().addSuccess(test)
                  self.passed += 1

          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2, resultclass=CountedResult).run(suite)
          rows = [
              '## CPU unit tests',
              '',
              '| Outcome | Count |',
              '| --- | ---: |',
              f'| Test methods run/reported (includes skips) | {result.testsRun} |',
              f'| Passed | {result.passed} |',
              f'| Skipped | {len(result.skipped)} |',
              f'| Failure events | {len(result.failures)} |',
              f'| Error events | {len(result.errors)} |',
              f'| Expected failures | {len(result.expectedFailures)} |',
              f'| Unexpected successes | {len(result.unexpectedSuccesses)} |',
              '',
              '### Skip reasons',
          ]
          rows += [f'- `{test.id()}`: {reason}' for test, reason in result.skipped] or ['- None']
          rows += ['', 'No model weights or GPU inference are part of this job.']
          print('\n'.join(rows))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('\n'.join(rows) + '\n')
          raise SystemExit(0 if result.testsRun > 0 and result.wasSuccessful() else 1)
          PY
